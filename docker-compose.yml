version: '3.8'

services:
  db:
    image: postgres:15
    container_name: veritas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialize schema on first run
      - ./veritas/go-orchestrator/storage/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veritas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: veritas/Dockerfile
    container_name: veritas-backend
    ports:
      - "4097:4097"
    environment:
      - PORT=4097
      - API_PUBLIC_URL=http://localhost:4097
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/veritas?sslmode=disable
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      - REVALIDATE_URL=http://frontend:3000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MODEL_ACCESS_KEY=${MODEL_ACCESS_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4097/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: veritas-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4097
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
