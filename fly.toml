app = "truthseeker"
primary_region = "ams"

[build]

[env]
  PORT = "4097"
  CORS_ORIGIN = "https://www.terranet.tech,https://truthopedia-web.vercel.app"
  DO_MODEL = "gemma-4-31B-it"

[[services]]
  internal_port = 4097
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
