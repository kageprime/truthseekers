app = "truthseeker"
primary_region = "ams"

[build]

[env]
  PORT = "4097"
  ENCARTA_DB_PATH = "/data/encarta.db"
  ENCARTA_REPO_PATH = "/data/encyclopedia"
  ENCARTA_MAX_CONCURRENT = "1"
  ENCARTA_MAX_QUEUE = "25"
  RATE_LIMIT = "20"
  NODE_ENV = "production"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "encarta_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
